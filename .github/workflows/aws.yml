name: Deploy

on: [push]
permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout del repositorio
      - uses: actions/checkout@master
      
      - name: Aprobacion Manual
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: IkeAsistencia
          
      # Configuracion de credenciales de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          
      # Abrir el puerto 22 en el grupo de seguridad
      - name: Abrir puerto 22 en el grupo de seguridad
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0
          
      # Copiar el contenido del repositorio con scp
      - name: Copiar el contenido del repositorio con scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          source: "ike-biossman-admin-prod/*"
          target: "/var/www/ike-admin-biurewards-prod/"
          strip_components: 1
          
      # Cerrar el puerto 22 en el grupo de seguridad
      - name: Cerrar puerto 22 en el grupo de seguridad
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0
